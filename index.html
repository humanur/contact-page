<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>İletişim</title>
  <meta name="description" content="Amine Hümanur Sağman'ın portfolyo ve iletişim sayfası.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Klavye kullanıcıları menüyü atlayıp doğrudan içeriğe gidebilsin -->
  <a class="skip-link" href="#main-content">İçeriğe geç</a>

  <header class="site-header">
    <p class="logo">42</p>
    <nav aria-label="Ana menü">
      <button id="menu-toggle" type="button" aria-expanded="false" aria-controls="menu">Menü</button>
      <ul id="menu">
        <li><a href="#about">Hakkımda</a></li>
        <li><a href="#contact">İletişim</a></li>
      </ul>
    </nav>
  </header>

  <main id="main-content">
    <section class="hero">
      <h1>Bize ulaşın</h1>
      <p>Herhangi bir sorunuz veya paylaşmak istediğiniz bir konu varsa aşağıdaki form aracılığıyla bizimle iletişime geçebilirsiniz.</p>
      <a class="btn" href="#contact">Bana yaz</a>
    </section>

    <section id="about" class="content-section">
      <h2>Hakkımda</h2>
      <p>Burayı boş bıraktım.</p>
    </section>

    <section id="contact" class="content-section">
      <h2>İletişim</h2>
      <p>Alanlar zorunludur.</p>

      <form id="contact-form" novalidate>
        <div class="field">
          <label for="name">Adın</label>
          <input id="name" name="name" type="text" autocomplete="name" required aria-describedby="name-error">
          <p class="error" id="name-error"></p>
        </div>

        <div class="field">
          <label for="email">E-posta adresin</label>
          <input id="email" name="email" type="email" autocomplete="email" required aria-describedby="email-error">
          <p class="error" id="email-error"></p>
        </div>

        <div class="field">
          <label for="message">Mesajın</label>
          <textarea id="message" name="message" rows="5" required aria-describedby="message-error"></textarea>
          <p class="error" id="message-error"></p>
        </div>

        <button class="btn" type="submit">Mesajı gönder</button>
        <!-- role="status": ekran okuyucu sonucu otomatik okur -->
        <p id="status" role="status"></p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>© 2026 · Tüm hakları saklıdır.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
